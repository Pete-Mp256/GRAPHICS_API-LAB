<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Snake</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #0a0a0f;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: 'Courier New', monospace;
    color: #e0e0e0;
    gap: 16px;
    user-select: none;
  }

  h1 {
    font-size: 1.6rem;
    letter-spacing: 0.3em;
    color: #4ade80;
    text-transform: uppercase;
  }

  .hud {
    display: flex;
    gap: 40px;
    font-size: 0.85rem;
    letter-spacing: 0.1em;
    color: #6b7280;
  }
  .hud span { color: #4ade80; font-size: 1rem; font-weight: bold; }

  canvas {
    border: 1px solid #1f2937;
    border-radius: 4px;
    display: block;
    image-rendering: pixelated;
  }

  .hint {
    font-size: 0.72rem;
    color: #374151;
    letter-spacing: 0.08em;
  }
</style>
</head>
<body>

<h1> Snake</h1>

<div class="hud">
  SCORE <span id="score">0</span>
  &nbsp;&nbsp;&nbsp;
  BEST <span id="best">0</span>
</div>

<canvas id="c" width="400" height="400"></canvas>

<p class="hint">ARROW KEYS or WASD &nbsp;·&nbsp; SPACE to start / pause</p>

<script>
const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d');

const COLS = 20, ROWS = 20;
const CELL = canvas.width / COLS;  // 20px per cell


const DIR = { UP:[0,-1], DOWN:[0,1], LEFT:[-1,0], RIGHT:[1,0] };

let snake, dir, nextDir, food, score, best=0, state, interval;

//Application Stage //
function init() {
  snake   = [{x:10,y:10},{x:9,y:10},{x:8,y:10}];
  dir     = DIR.RIGHT;
  nextDir = DIR.RIGHT;
  score   = 0;
  updateScore();
  placeFood();
  state = 'idle';
  render();
}

function placeFood() {
  const occupied = new Set(snake.map(s => `${s.x},${s.y}`));
  let f;
  do { f = { x: Math.floor(Math.random()*COLS), y: Math.floor(Math.random()*ROWS) }; }
  while (occupied.has(`${f.x},${f.y}`));
  food = f;
}

function tick() {
  if (state !== 'running') return;

  dir = nextDir;
  const head = { x: snake[0].x + dir[0], y: snake[0].y + dir[1] };

 
  if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS) return die();
 
  if (snake.some(s => s.x === head.x && s.y === head.y)) return die();

  snake.unshift(head);

  if (head.x === food.x && head.y === food.y) {
    score++;
    updateScore();
    placeFood();
  } else {
    snake.pop();
  }

  render();
}

function die() {
  state = 'dead';
  if (score > best) { best = score; document.getElementById('best').textContent = best; }
  render();
}

function updateScore() {
  document.getElementById('score').textContent = score;
}

function speed() {

  return Math.max(80, 200 - score * 8);
}

function startLoop() {
  clearInterval(interval);
  interval = setInterval(tick, speed());
}


const _tick = tick;


function render() {
  
  ctx.fillStyle = '#0a0a0f';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  
  ctx.strokeStyle = 'rgba(255,255,255,0.03)';
  ctx.lineWidth = 0.5;
  for (let x = 0; x <= COLS; x++) {
    ctx.beginPath(); ctx.moveTo(x*CELL,0); ctx.lineTo(x*CELL, canvas.height); ctx.stroke();
  }
  for (let y = 0; y <= ROWS; y++) {
    ctx.beginPath(); ctx.moveTo(0,y*CELL); ctx.lineTo(canvas.width, y*CELL); ctx.stroke();
  }

  
  const fx = food.x * CELL, fy = food.y * CELL;
  ctx.fillStyle = '#f87171';
  ctx.beginPath();
  ctx.arc(fx + CELL/2, fy + CELL/2, CELL/2 - 2, 0, Math.PI*2);
  ctx.fill();
  
  ctx.fillStyle = 'rgba(255,255,255,0.35)';
  ctx.beginPath();
  ctx.arc(fx + CELL/2 - 3, fy + CELL/2 - 3, 3, 0, Math.PI*2);
  ctx.fill();

  
  snake.forEach((seg, i) => {
    const t = i / snake.length;  
    
    const g = Math.round(180 - t * 80);
    const b = Math.round(80 - t * 60);
    ctx.fillStyle = `rgb(30,${g},${b})`;
    const pad = i === 0 ? 1 : 2;
    roundRect(seg.x*CELL + pad, seg.y*CELL + pad, CELL - pad*2, CELL - pad*2, 4);
    ctx.fill();

    
    if (i === 0) {
      ctx.fillStyle = '#e0fce0';
      const ex = seg.x * CELL + CELL/2, ey = seg.y * CELL + CELL/2;
      const [dx, dy] = dir;
      const ex1 = ex + dx*3 + dy*4,  ey1 = ey + dy*3 - dx*4;
      const ex2 = ex + dx*3 - dy*4,  ey2 = ey + dy*3 + dx*4;
      ctx.beginPath(); ctx.arc(ex1, ey1, 2, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(ex2, ey2, 2, 0, Math.PI*2); ctx.fill();
    }
  });

  
  if (state === 'idle') {
    overlay('SNAKE', 'SPACE to play', '#4ade80');
  } else if (state === 'paused') {
    overlay('PAUSED', 'SPACE to resume', '#facc15');
  } else if (state === 'dead') {
    overlay('GAME OVER', `Score: ${score} · SPACE to restart`, '#f87171');
  }
}

//Rasterization//
function overlay(title, sub, color) {
  ctx.fillStyle = 'rgba(0,0,0,0.65)';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  ctx.fillStyle = color;
  ctx.font = 'bold 2rem "Courier New"';
  ctx.textAlign = 'center';
  ctx.fillText(title, canvas.width/2, canvas.height/2 - 14);

  ctx.fillStyle = '#9ca3af';
  ctx.font = '0.8rem "Courier New"';
  ctx.fillText(sub, canvas.width/2, canvas.height/2 + 18);
  ctx.textAlign = 'left';
}

//Geomentry Stage//
function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x+r, y);
  ctx.lineTo(x+w-r, y); ctx.arcTo(x+w, y,   x+w, y+r,   r);
  ctx.lineTo(x+w, y+h-r); ctx.arcTo(x+w, y+h, x+w-r, y+h, r);
  ctx.lineTo(x+r, y+h); ctx.arcTo(x,   y+h, x,   y+h-r, r);
  ctx.lineTo(x,   y+r);   ctx.arcTo(x,   y,   x+r, y,     r);
  ctx.closePath();
}


document.addEventListener('keydown', e => {
  if (e.key === ' ' || e.code === 'Space') {
    e.preventDefault();
    if (state === 'idle' || state === 'dead') { init(); state = 'running'; startLoop(); render(); }
    else if (state === 'running') { state = 'paused'; render(); }
    else if (state === 'paused')  { state = 'running'; startLoop(); }
    return;
  }

  const map = {
    ArrowUp:'UP', ArrowDown:'DOWN', ArrowLeft:'LEFT', ArrowRight:'RIGHT',
    w:'UP', s:'DOWN', a:'LEFT', d:'RIGHT',
    W:'UP', S:'DOWN', A:'LEFT', D:'RIGHT',
  };
  const d = map[e.key];
  if (!d) return;
  e.preventDefault();

  const nd = DIR[d];
  
  if (nd[0] !== -dir[0] || nd[1] !== -dir[1]) nextDir = nd;
});


const origTick = tick;
setInterval(() => {
  if (state === 'running') {
    clearInterval(interval);
    interval = setInterval(tick, speed());
  }
}, 500);

init();
</script>
</body>
</html>
